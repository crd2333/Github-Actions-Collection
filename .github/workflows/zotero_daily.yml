name: Send emails daily
on:
  workflow_dispatch:
    inputs:
      date:
        description: 'Date to query (YYYY-MM-DD)'
        required: false
        type: string
  schedule:
    - cron: '0 8 * * *'

jobs:
  workflow-keepalive:
    if: github.event_name == 'schedule'|| github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - uses: liskin/gh-workflow-keepalive@v1

  calculate-and-send:
    runs-on: ubuntu-latest
    environment: zotero
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.REPOSITORY }}
          ref: ${{ vars.REF }}

      - name: Setup uv
        uses: astral-sh/setup-uv@v3
        with:
          version: '0.5.4'

      - name: Run script
        env:
          ZOTERO_ID: ${{ secrets.ZOTERO_ID }}
          ZOTERO_KEY: ${{ secrets.ZOTERO_KEY }}
          SENDER: ${{ secrets.SENDER }}
          RECEIVER: ${{ secrets.RECEIVER }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_API_BASE: ${{ secrets.OPENAI_API_BASE }}
          CUSTOM_CONFIG: ${{ vars.CUSTOM_CONFIG }}
        run: |
          printf "%b\n" "$CUSTOM_CONFIG" > config/custom.yaml
          echo "Use custom config: "
          cat config/custom.yaml
          if [ -n "${{ inputs.date }}" ]; then
            uv run src/zotero_arxiv_daily/main.py source.arxiv.query_date="${{ inputs.date }}"
          else
            uv run src/zotero_arxiv_daily/main.py
          fi
